<div class="min-h-screen flex items-center justify-center bg-gray-900">
  <div class="max-w-md p-6 bg-gray-800 rounded-lg shadow-md">

    <h2 class="text-white text-xl font-semibold mb-4">Add new Employee</h2>
    <form class="space-y-4" (ngSubmit)="addStaff()" #updateForm="ngForm">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="username" class="block text-sm font-medium text-gray-300">Name</label>
          <input type="text" id="username" [(ngModel)]="em.name" name="username" placeholder="username.example" class="mt-1 w-full rounded-md bg-gray-700 border border-gray-600 text-white focus:ring-blue-500 focus:border-blue-500 p-2.5" required />
        </div>
        <div>
          <label for="email" class="block text-sm font-medium text-gray-300">Email</label>
          <input type="email" id="email" [(ngModel)]="em.email" name="email" placeholder="name@company.com" class="mt-1 w-full rounded-md bg-gray-700 border border-gray-600 text-white focus:ring-blue-500 focus:border-blue-500 p-2.5" required />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="address" class="block text-sm font-medium text-gray-300">Address</label>
          <input type="text" id="address" [(ngModel)]="em.address" name="address" class="mt-1 w-full rounded-md bg-gray-700 border border-gray-600 text-white focus:ring-blue-500 focus:border-blue-500 p-2.5" required />
        </div>
        <div>
          <label for="salary" class="block text-sm font-medium text-gray-300">Salary</label>
          <input type="number" id="salary" [(ngModel)]="em.salary" name="salary" class="mt-1 w-full rounded-md bg-gray-700 border border-gray-600 text-white focus:ring-blue-500 focus:border-blue-500 p-2.5" required />
        </div>
      </div>

      <button type="submit" class="mt-4 w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center">
        + Add Employee
      </button>
    </form>
  </div>
</div>
