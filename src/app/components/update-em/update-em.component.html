<div class="max-w-xl mx-auto mt-10 p-6 bg-white rounded-xl shadow-2xl">
  <h2 class="text-2xl font-bold text-center text-blue-700 mb-6">Update Employee</h2>

  <form (ngSubmit)="updateEm()" #updateForm="ngForm">

    <div class="mb-4">
      <label class="block text-gray-700 font-semibold mb-2">ID</label>
      <input
        type="text"
        [(ngModel)]="em.id"
        name="id"
        required
        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>
    <!-- Name -->

    <div class="mb-4">
      <label class="block text-gray-700 font-semibold mb-2">Name</label>
      <input
        type="text"
        [(ngModel)]="em.name"
        name="name"
        required
        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>

    <!-- Email -->
    <div class="mb-4">
      <label class="block text-gray-700 font-semibold mb-2">Email</label>
      <input
        type="email"
        [(ngModel)]="em.email"
        name="email"
        required
        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>

    <!-- Address -->
    <div class="mb-4">
      <label class="block text-gray-700 font-semibold mb-2">Address</label>
      <input
        type="text"
        [(ngModel)]="em.address"
        name="address"
        required
        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>

    <!-- Salary -->
    <div class="mb-4">
      <label class="block text-gray-700 font-semibold mb-2">Salary</label>
      <input
        type="number"
        [(ngModel)]="em.salary"
        name="salary"
        required
        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>

    <!-- Submit Button -->
    <div class="text-center">
      <button
        type="submit"
        class="bg-blue-600 text-white px-6 py-2 rounded-xl hover:bg-blue-700 transition duration-300"
      >
        Update
      </button>
    </div>
  </form>
</div>
